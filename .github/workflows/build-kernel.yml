name: Build Xiaomi 11 (Venus) DC Dimming Module

on:
  workflow_dispatch:
  push:
    branches:
      - sixteen
      - seventeen
    paths:
      - 'techpack/display/**'
      - '.github/workflows/**'

jobs:
  build:
    name: Build msm_drm.ko Module with Proton-Clang
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            ca-certificates \
            curl \
            flex \
            gcc \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            make \
            python3 \
            xz-utils \
            zip

      - name: Setup Proton-Clang Toolchain
        run: |
          echo "Cloning Proton-Clang toolchain..."
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git "$GITHUB_WORKSPACE/proton-clang"
          "$GITHUB_WORKSPACE/proton-clang/bin/clang" --version

      - name: Fix Vermagic to Match Stock Kernel Exactly
        run: |
          # Matches stock kernel vermagic: 5.4.302-qgki-g73e93336f3ae
          echo "-g73e93336f3ae" > .scmversion
          echo "Fixed localversion to: $(cat .scmversion)"

      - name: Generate Kernel Configuration
        run: |
          export PATH="$GITHUB_WORKSPACE/proton-clang/bin:$PATH"
          mkdir -p out

          echo "Merging defconfig for Venus (SM8350)..."
          ARCH=arm64 ./scripts/kconfig/merge_config.sh -m -O out \
            arch/arm64/configs/vendor/lahaina-qgki_defconfig \
            arch/arm64/configs/vendor/lahaina_QGKI.config \
            arch/arm64/configs/vendor/xiaomi_QGKI.config \
            arch/arm64/configs/vendor/venus_QGKI.config

          make -j$(nproc --all) O=out ARCH=arm64 CC=clang olddefconfig

      - name: Compile Display Module (msm_drm.ko)
        run: |
          export PATH="$GITHUB_WORKSPACE/proton-clang/bin:$PATH"

          # Build Image and modules
          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image modules

          echo "Locating built msm_drm.ko module..."
          find out/ -name "msm_drm.ko" -ls

      - name: Package APatch / Magisk Module
        run: |
          echo "Packaging APatch / Magisk Module..."
          MODULE_DIR="$GITHUB_WORKSPACE/venus_dc_module"
          mkdir -p "$MODULE_DIR/system/vendor_dlkm/lib/modules"

          # Copy compiled msm_drm.ko
          KO_PATH=$(find out/ -name "msm_drm.ko" | head -n 1)
          cp "$KO_PATH" "$MODULE_DIR/system/vendor_dlkm/lib/modules/msm_drm.ko"
          cp "$KO_PATH" "$GITHUB_WORKSPACE/msm_drm.ko"

          # Check vermagic of the compiled module
          echo "Checking vermagic of compiled module:"
          strings "$MODULE_DIR/system/vendor_dlkm/lib/modules/msm_drm.ko" | grep -E "vermagic=" || true

          # Create module.prop
          cat << 'EOF' > "$MODULE_DIR/module.prop"
          id=venus_dc_dimming
          name=Xiaomi 11 Hardware DC Dimming
          version=v1.0
          versionCode=1
          author=szx
          description=Hardware DC Dimming for Xiaomi 11 (Venus). Seamlessly replaces msm_drm.ko with DCS commands (53 28 / 53 20) via /sys/devices/platform/soc/soc:qcom,dsi-display-primary/dc_dimming.
          EOF
          sed -i 's/^[ \t]*//' "$MODULE_DIR/module.prop"

          # Create Magisk/APatch installer structure
          mkdir -p "$MODULE_DIR/META-INF/com/google/android"
          echo "#MAGISK" > "$MODULE_DIR/META-INF/com/google/android/updater-script"
          
          # Use standard Magisk module installer entry
          cat << 'EOF' > "$MODULE_DIR/META-INF/com/google/android/update-binary"
          #!/sbin/sh
          umask 022
          OUTFD=$2
          ZIPFILE=$3

          ui_print() {
            echo -e "$1" >&2
          }

          ui_print "****************************************"
          ui_print "*   Xiaomi 11 Hardware DC Dimming      *"
          ui_print "*          by szx                      *"
          ui_print "****************************************"

          # APatch / Magisk auto installation redirect
          if [ -n "$APATCH" ] || [ -f "/data/adb/ap/bin/magisk" ]; then
            ui_print "- Installing as APatch module..."
          fi

          [ -z "$MAGISKTMP" ] && export MAGISKTMP=/dev/tmp
          if [ -f "$MAGISKTMP/magisk" ]; then
            exec "$MAGISKTMP/magisk" --install-module "$ZIPFILE"
          elif [ -f "/data/adb/ap/bin/magisk" ]; then
            exec "/data/adb/ap/bin/magisk" --install-module "$ZIPFILE"
          fi

          exit 0
          EOF
          sed -i 's/^[ \t]*//' "$MODULE_DIR/META-INF/com/google/android/update-binary"
          chmod 755 "$MODULE_DIR/META-INF/com/google/android/update-binary"

          # Also provide customize.sh
          cat << 'EOF' > "$MODULE_DIR/customize.sh"
          ui_print "- Installing Venus DC Dimming Driver module..."
          ui_print "- Driver target: /vendor_dlkm/lib/modules/msm_drm.ko"
          set_perm_recursive $MODPATH 0 0 0755 0644
          EOF
          sed -i 's/^[ \t]*//' "$MODULE_DIR/customize.sh"

          # Create flashable zip
          cd "$MODULE_DIR"
          zip -r9 "$GITHUB_WORKSPACE/Venus-DC-Dimming-APatch-Module.zip" *
          cd "$GITHUB_WORKSPACE"

      - name: Upload APatch / Magisk Module ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Venus-DC-Dimming-APatch-Module
          path: Venus-DC-Dimming-APatch-Module.zip

      - name: Upload Standalone msm_drm.ko
        uses: actions/upload-artifact@v4
        with:
          name: Standalone-msm_drm-ko
          path: msm_drm.ko
